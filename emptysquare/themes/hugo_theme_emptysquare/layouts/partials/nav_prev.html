{{ if . }}
{{ if eq .Type "post" }}
  <div class="nav-previous">
    <a href="{{ .Permalink }}"><span class="meta-nav">&larr;&nbsp;</span>{{ .Title }}</a>
  </div>
{{ else }}
  {{/* Recurse past non-post pages until a post or the end of the chain. Confusingly, Hugo reverses next and previous. */}}
  {{ partial "nav_prev" .Prev }}
{{ end }}
{{ end }}
